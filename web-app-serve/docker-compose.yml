# NOTE: The name is mandatory and should be unique
name: ${COMPOSE_PROJECT_NAME:-capn-nepal-website-cms}

services:
  web-app-serve:
    build:
      context: ../
      target: web-app-serve
    environment:
      # web-app-serve config: dumps unreplaced placeholders + diffs at /__debug/
      APPLY_CONFIG__ENABLE_DEBUG: "true"
      # NOTE: APP_TITLE is intentionally absent — it is a default (overridable)
      # var baked as an ENV ("CMS") in the Dockerfile final stage. Passing it here
      # (even as ${APP_TITLE:-CMS}) would mask the baked-default test. Override it
      # at runtime by setting APP_TITLE in the environment / local .env.
      # Dynamic configs (local defaults; override via an optional local .env)
      APP_GRAPHQL_ENDPOINT: "${APP_GRAPHQL_ENDPOINT:-http://localhost:8000/graphql/}"
    # NOTE: See the repo-root "Dockerfile" for the full set of dynamic env variables.
    env_file:
      - path: .env
        required: false
    ports:
      - '8050:80'
